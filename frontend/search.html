<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search results on NexFlix">
  <meta name="theme-color" content="#0f0f0f">
  <title>Search Results - NexFlix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">NexFlix</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="genre.html?genre=action">Movies</a>
      <a href="genre.html?genre=drama">Series</a>
      <a href="genre.html?genre=anime">Anime</a>
      <a href="genre.html?genre=drama-korea">Drama Korea</a>
    </div>
    <div class="nav-search">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search movies..." autocomplete="off">
    </div>
    <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
  </nav>

  <!-- Mobile Menu -->
  <div class="nav-mobile-menu">
    <a href="index.html">Home</a>
    <a href="genre.html?genre=action">Movies</a>
    <a href="genre.html?genre=drama">Series</a>
    <a href="genre.html?genre=anime">Anime</a>
    <a href="genre.html?genre=drama-korea">Drama Korea</a>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="search-header">
      <h1>Search results for: <span id="search-query"></span></h1>
    </div>

    <div class="movie-grid" id="movie-grid">
      <!-- Search results loaded dynamically -->
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 NexFlix. All rights reserved.</p>
    <p class="disclaimer">Disclaimer: This site does not store any files on its server. All contents are provided by non-affiliated third parties.</p>
  </footer>

  <script src="js/config.js"></script>
  <script>
    (function () {
      'use strict';

      document.addEventListener('DOMContentLoaded', function () {
        var query = getUrlParam('q');
        var page = parseInt(getUrlParam('page'), 10) || 1;

        var queryDisplay = document.querySelector('#search-query');
        var searchInput = document.querySelector('#search-input');

        if (queryDisplay && query) {
          queryDisplay.textContent = query;
        }

        if (searchInput && query) {
          searchInput.value = query;
        }

        initSearch();

        if (!query || !query.trim()) {
          showEmpty('Please enter a search term.');
          return;
        }

        document.title = 'Search: ' + query + ' - NexFlix';
        performSearch(query, page);
      });

      function performSearch(query, page) {
        showLoading();

        fetch(API_BASE_URL + '/movies/search?q=' + encodeURIComponent(query) + '&page=' + page)
          .then(function (res) {
            if (!res.ok) throw new Error('Search failed');
            return res.json();
          })
          .then(function (result) {
            if (result.success && result.data && result.data.length > 0) {
              renderResults(result.data);
              if (result.pagination) {
                setupPagination(result.pagination.currentPage, result.pagination.totalPages, query);
              }
            } else {
              showEmpty('No results found for "' + query + '". Try a different search term.');
            }
          })
          .catch(function () {
            showError('Search failed. Please make sure the backend server is running.');
          });
      }

      function renderResults(movies) {
        var grid = document.querySelector('#movie-grid');
        if (!grid) return;
        grid.innerHTML = '';

        movies.forEach(function (movie) {
          var card = createCard(movie);
          grid.appendChild(card);
        });

        // Load images
        grid.querySelectorAll('img.lazy').forEach(function (img) {
          if (img.dataset.src) { img.src = img.dataset.src; }
        });
      }

      function createCard(movie) {
        var card = document.createElement('a');
        card.className = 'movie-card';
        card.href = 'movie.html?slug=' + encodeURIComponent(movie.slug);

        var qualityClass = (movie.quality && movie.quality.toLowerCase().indexOf('cam') !== -1) ? ' cam' : '';
        var ratingHtml = movie.rating ? '<span class="rating-badge">' + escapeHtml(movie.rating) + '</span>' : '';
        var qualityHtml = movie.quality ? '<span class="quality-badge' + qualityClass + '">' + escapeHtml(movie.quality) + '</span>' : '';
        var imgHtml = movie.thumbnail
          ? '<img class="lazy" data-src="' + escapeHtml(movie.thumbnail) + '" alt="' + escapeHtml(movie.title) + '">'
          : '<div style="width:100%;height:100%;background:var(--bg-hover);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:0.8rem;padding:10px;text-align:center;">' + escapeHtml(movie.title) + '</div>';

        card.innerHTML =
          '<div class="card-image">' + imgHtml + ratingHtml + qualityHtml + '<div class="card-overlay"></div></div>' +
          '<div class="card-info"><div class="card-title">' + escapeHtml(movie.title) + '</div><div class="card-year">' + escapeHtml(movie.year || '') + '</div></div>';
        return card;
      }

      function setupPagination(current, total, query) {
        var container = document.querySelector('#pagination');
        if (!container || total <= 1) return;

        var html = '';
        html += '<button ' + (current <= 1 ? 'disabled' : '') + ' onclick="window.searchNavigate(' + (current - 1) + ')">&laquo; Previous</button>';
        html += '<span class="page-info">Page ' + current + ' of ' + total + '</span>';
        html += '<button ' + (current >= total ? 'disabled' : '') + ' onclick="window.searchNavigate(' + (current + 1) + ')">Next &raquo;</button>';
        container.innerHTML = html;

        window.searchNavigate = function (p) {
          var params = new URLSearchParams(window.location.search);
          params.set('page', p);
          window.location.search = params.toString();
        };
      }

      function showLoading() {
        var grid = document.querySelector('#movie-grid');
        if (!grid) return;
        var html = '';
        for (var i = 0; i < 8; i++) {
          html += '<div class="movie-card skeleton"><div class="skeleton-card"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>';
        }
        grid.innerHTML = html;
      }

      function showEmpty(msg) {
        var grid = document.querySelector('#movie-grid');
        if (!grid) return;
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">&#128269;</div><h3>No Results</h3><p>' + escapeHtml(msg) + '</p><a href="index.html" class="btn btn-primary">Back to Home</a></div>';
      }

      function showError(msg) {
        var grid = document.querySelector('#movie-grid');
        if (!grid) return;
        grid.innerHTML = '<div class="error-state" style="grid-column:1/-1;"><p>' + escapeHtml(msg) + '</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div>';
      }

      function initSearch() {
        var input = document.querySelector('#search-input');
        if (!input) return;
        input.addEventListener('keyup', function (e) {
          if (e.key === 'Enter' && e.target.value.trim().length > 0) {
            window.location.href = 'search.html?q=' + encodeURIComponent(e.target.value.trim());
          }
        });
      }

      function getUrlParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
