<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse movies by genre on NexFlix">
  <meta name="theme-color" content="#0f0f0f">
  <title>Genre - NexFlix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">NexFlix</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="genre.html?genre=action">Movies</a>
      <a href="genre.html?genre=drama">Series</a>
      <a href="genre.html?genre=anime">Anime</a>
      <a href="genre.html?genre=drama-korea">Drama Korea</a>
    </div>
    <div class="nav-search">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Search movies..." autocomplete="off">
    </div>
    <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
  </nav>

  <!-- Mobile Menu -->
  <div class="nav-mobile-menu">
    <a href="index.html">Home</a>
    <a href="genre.html?genre=action">Movies</a>
    <a href="genre.html?genre=drama">Series</a>
    <a href="genre.html?genre=anime">Anime</a>
    <a href="genre.html?genre=drama-korea">Drama Korea</a>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="genre-header">
      <h1 id="genre-title">Genre</h1>
    </div>

    <div class="movie-grid" id="movie-grid">
      <!-- Movies loaded dynamically -->
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 NexFlix. All rights reserved.</p>
    <p class="disclaimer">Disclaimer: This site does not store any files on its server. All contents are provided by non-affiliated third parties.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script>
    (function () {
      'use strict';

      document.addEventListener('DOMContentLoaded', function () {
        var genre = getUrlParam('genre');
        var page = parseInt(getUrlParam('page'), 10) || 1;

        var titleEl = document.querySelector('#genre-title');
        if (titleEl && genre) {
          var displayName = genre.replace(/-/g, ' ');
          titleEl.textContent = displayName.charAt(0).toUpperCase() + displayName.slice(1);
          document.title = displayName.charAt(0).toUpperCase() + displayName.slice(1) + ' - NexFlix';
        }

        initSearch();

        if (!genre) {
          showEmpty('No genre specified.');
          return;
        }

        loadGenre(genre, page);
      });

      function loadGenre(genre, page) {
        showLoading();

        fetch(API_BASE_URL + '/genres/' + encodeURIComponent(genre) + '?page=' + page)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed');
            return res.json();
          })
          .then(function (result) {
            if (result.success && result.data && result.data.length > 0) {
              renderResults(result.data);
              if (result.pagination) {
                setupPagination(result.pagination.currentPage, result.pagination.totalPages, 'genreNavigate');
              }
            } else {
              showEmpty('No movies found in this genre.');
            }
          })
          .catch(function () {
            showError('Unable to load movies. Please make sure the backend server is running.');
          });
      }

      function renderResults(movies) {
        var grid = document.querySelector('#movie-grid');
        if (!grid) return;
        grid.innerHTML = '';

        movies.forEach(function (movie) {
          var card = createCard(movie);
          grid.appendChild(card);
        });

        // Load images
        grid.querySelectorAll('img.lazy').forEach(function (img) {
          if (img.dataset.src) { img.src = img.dataset.src; }
        });
      }

      window.genreNavigate = function (p) {
        var params = new URLSearchParams(window.location.search);
        params.set('page', p);
        window.location.search = params.toString();
      };
    })();
  </script>
</body>
</html>
